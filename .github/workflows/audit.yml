name: Audit Deployed Site

on:
  workflow_dispatch:
  schedule:
    # Check the live site after the daily generation run has had time to publish.
    - cron: "37 8 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: "site-audit"
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit deployed site and published data
        run: >-
          python scripts/audit_site.py
          --site-url "${{ vars.SITE_URL || 'https://ryantjx.github.io/tennis_ssm/' }}"
          --data-base-url "${{ vars.VITE_DATA_BASE_URL || format('https://raw.githubusercontent.com/{0}/{1}/main/outputs/latest', github.repository_owner, github.event.repository.name) }}"
          --max-age-days 3

      - name: Open or update audit issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "site-audit";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body: `Audit still failing: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Deployed site audit is failing",
                body: [
                  "The deployed site audit failed.",
                  "",
                  `- Run: ${runUrl}`,
                  "",
                  "The site may be unreachable or serving stale data.",
                ].join("\n"),
                labels: [label],
              });
            }

      - name: Close audit issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "site-audit";
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            for (const issue of open.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
