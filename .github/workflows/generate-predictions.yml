name: Generate Daily Predictions

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the Python test gate (recovery only)"
        type: boolean
        default: false
  schedule:
    # Avoid the top-of-hour scheduler backlog and publish before the WTA day.
    - cron: "17 6 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: "daily-predictions"
  # Queue rather than cancel: a cancelled run reports "cancelled" rather than
  # "failed", which hides problems and can discard a completed-but-unpushed run.
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A full history keeps `git pull --rebase` reliable; a shallow clone
          # can fail with "shallow update not allowed".
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv and install dependencies
        run: |
          uv venv .venv
          uv pip install -r requirements.txt

      - name: Run Python tests
        if: ${{ !inputs.skip_tests }}
        run: |
          source .venv/bin/activate
          python -m unittest discover -s tests -t .

      - name: Generate latest prediction data
        run: |
          source .venv/bin/activate
          for attempt in 1 2 3; do
            if python main.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Report generated data freshness
        run: |
          source .venv/bin/activate
          python scripts/report_freshness.py

      - name: Commit prediction outputs
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/tennis_factorial_state.json outputs/latest outputs/daily
          if git diff --cached --quiet; then
            echo "No output changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update daily predictions $(date -u +%Y-%m-%d)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Merge prediction pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `main` is protected by a ruleset that only accepts merged pull
          # requests. GitHub does not allow the Actions integration to bypass
          # the rule on a user-owned repository, so the bot opens a pull
          # request and merges it. The ruleset requires zero approvals and no
          # status checks, so this completes unattended.
          BRANCH="predictions/${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${BRANCH}"

          DATE=$(date -u +%Y-%m-%d)
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${BRANCH}" \
            --title "Update daily predictions (${DATE})" \
            --body "$(printf 'Automated daily prediction update.\n\n- Run: %s/%s/actions/runs/%s\n- Data as of: %s\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "${DATE}")"

          PR_NUMBER=$(gh pr view "${BRANCH}" --json number --jq .number)
          # Merge through the REST endpoint: `gh pr merge` pre-checks
          # mergeStateStatus and refuses while it still reports a stale BLOCKED
          # value, whereas the REST merge evaluates the ruleset directly.
          for attempt in 1 2 3 4 5; do
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
              -f merge_method=squash; then
              echo "Merged PR #${PR_NUMBER}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" || true
              exit 0
            fi
            echo "Merge attempt ${attempt} failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::Could not merge prediction PR #${PR_NUMBER}"
          exit 1

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "pipeline-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The daily prediction workflow failed.",
              "",
              `- Run: ${runUrl}`,
              `- Commit: \`${context.sha}\``,
              `- Trigger: \`${context.eventName}\``,
              "",
              "Until this is fixed the deployed site keeps serving the previous snapshot.",
            ].join("\n");

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body: `Still failing: ${runUrl}`,
              });
              core.info(`Commented on existing issue #${open.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Daily prediction generation is failing",
                body,
                labels: [label],
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      - name: Close failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "pipeline-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: generation succeeded in ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

