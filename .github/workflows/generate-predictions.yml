name: Generate Daily Predictions

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the Python test gate (recovery only)"
        type: boolean
        default: false
  schedule:
    # Avoid the top-of-hour scheduler backlog and publish before the WTA day.
    - cron: "17 6 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: "daily-predictions"
  # Queue rather than cancel: a cancelled run reports "cancelled" rather than
  # "failed", which hides problems and can discard a completed-but-unpushed run.
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A full history keeps `git pull --rebase` reliable; a shallow clone
          # can fail with "shallow update not allowed".
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Create venv and install dependencies
        run: |
          uv venv .venv
          uv pip install -r requirements.txt

      - name: Run Python tests
        if: ${{ !inputs.skip_tests }}
        run: |
          source .venv/bin/activate
          python -m unittest discover -s tests -t .

      - name: Generate latest prediction data
        run: |
          source .venv/bin/activate
          for attempt in 1 2 3; do
            if python main.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Report generated data freshness
        run: |
          source .venv/bin/activate
          python scripts/report_freshness.py

      - name: Commit prediction outputs
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/tennis_factorial_state.json outputs/latest outputs/daily
          if git diff --cached --quiet; then
            echo "No output changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update daily predictions $(date -u +%Y-%m-%d)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish prediction outputs
        if: steps.commit.outputs.changed == 'true'
        env:
          # `main` is protected by a ruleset that only accepts merged pull
          # requests. A write-level Actions token cannot bypass it on a
          # user-owned repository, and weakening the rule to let a bot through
          # would remove the review gate for humans too. Instead the generated
          # data is published on this dedicated, unprotected branch, which the
          # frontend reads. Source code stays PR-gated on main.
          DATA_BRANCH: data
        run: |
          # Force is safe here: the branch holds only generated artifacts, and
          # each run is a complete snapshot. It keeps history from growing by
          # one full multi-megabyte payload per day.
          git push --force origin "HEAD:refs/heads/${DATA_BRANCH}"
          echo "Published predictions to the ${DATA_BRANCH} branch"
          echo "::notice::Data published to ${DATA_BRANCH}; main remains PR-gated."

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "pipeline-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The daily prediction workflow failed.",
              "",
              `- Run: ${runUrl}`,
              `- Commit: \`${context.sha}\``,
              `- Trigger: \`${context.eventName}\``,
              "",
              "Until this is fixed the deployed site keeps serving the previous snapshot.",
            ].join("\n");

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body: `Still failing: ${runUrl}`,
              });
              core.info(`Commented on existing issue #${open.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Daily prediction generation is failing",
                body,
                labels: [label],
              });
              core.info(`Opened issue #${created.data.number}`);
            }

      - name: Close failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "pipeline-failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: generation succeeded in ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

